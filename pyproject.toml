[project]
name = "mac"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "einops>=0.8.1",
    "lpips>=0.1.4",
    "matplotlib>=3.10.7",
    "natsort>=8.4.0",
    "nvitop>=1.6.1",
    "omegaconf>=2.3.0",
    "opencv-python>=4.12.0.88",
    "rich>=14.2.0",
    "scikit-image>=0.25.2",
    "swanlab>=0.6.4",
    "timm>=1.0.22",
    "torch>=2.9.1",
    "torchaudio>=2.9.1",
    "torchvision>=0.24.1",
    "warmup-scheduler>=0.3",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
