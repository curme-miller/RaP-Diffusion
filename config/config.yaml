model:
  target: model.LiRa_AKODE.LiRaAKODEnet
  ckpt_path: ~
  params:
    image_size: 64
    in_channels: 3
    model_channels: 160
    out_channels: 3
    num_res_blocks: [2, 2, 2, 2]
    attention_resolutions: [64,32,16,8]
    dropout: 0
    channel_mult: [1, 2, 4, 8]
    conv_resample: True
    dims: 2
    use_fp16: False
    num_heads: 8
    num_head_channels: 32
    use_scale_shift_norm: True
    resblock_updown: False
    swin_depth: 2
    swin_embed_dim: 192
    window_size: 8
    mlp_ratio: 2.0
    patch_norm: False
    cond_x0: True
    cond_mask: False
    x0_size: 256


diffusion:
  target: model.Diff.create_rap_diffusion

  params:
    sf: 1
    schedule_name: exponential
    schedule_kwargs:
      power: 0.3
    etas_end: 0.99
    steps: 100
    min_noise_level: 0.2
    kappa: 2.0
    weighted_mse: False
    predict_type: xstart
    timestep_respacing: ~
    scale_factor: 1.0
    normalize_input: True
    latent_flag: True
    optical_kwargs:
      enable: true              # [ true | false ]
      shot_strength: 0.08       # 光子散粒噪声系数（在潜空间的强度代理上）
      read_std: 0.02            # 读出噪声标准差（常数项）
      normalize_sigma: true     # 使每个样本的噪声 map 平均值为 1，稳定训练
      intensity_proxy: "l2"     # [ l1 | l2 | abs_mean ]


autoencoder:
  target: encoder.VQ.VQ
  ckpt_path: /home/v4-5090/zlx/VQ.pth
  tune_decoder: False
  params:
    embed_dim: 3
    n_embed: 8192
    lora_tune_decoder: False
    ddconfig:
      double_z: False
      z_channels: 3
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [1, 2, 4]
      num_res_blocks: 2
      attn_resolutions: []
      dropout: 0.0
      padding_mode: zeros

lpips:
  net: alex

data:
  train:
    type: paired
    params:
      transform_type: rcrop_aug_norm
      transform_kwargs:
        pass_aug: False
        pch_size: 256
        mean: 0.5
        std: 0.5
        max_value: 255
      im_exts: png
      length: ~
      recursive: False
  val:
    type: paired
    params:
      transform_type: default
      transform_kwargs:
        pass_aug: True
        pch_size: 256
        mean: 0.5
        std: 0.5
        max_value: 255
      im_exts: png
      length: 32
      recursive: False

train:
  lr: 5e-5
  lr_min: 5e-6
  lr_schedule: cosin
  warmup_iterations: 2000
  batch: [64, 1]
  length: 100
  microbatch: 4
  num_workers: 4
  prefetch_factor: 2
  weight_decay: 0
  ema_rate: 0.999
  iterations: 100000
  save_freq: 5
  log_freq: [500, 2000, 1]
  loss_coef: [1.0, 4.0, 0.0]
  local_logging: True
  tf_logging: False
  use_ema_val: True
  val_freq: ${train.save_freq}
  val_y_channel: True
  val_resolution: ${model.params.x0_size}
  val_padding_mode: reflect
  use_amp: True
  seed: 123456
  global_seeding: False
  use_swanlab: False
  swanlab_name: RaP-Diffusion
  compile:
    flag: False
    mode: reduce-overhead